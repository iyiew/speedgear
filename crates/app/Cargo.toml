[package]
name = "speedgear"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
speedgear_core = { path = "../core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# 不经 Tauri CLI 直接 cargo build 时，需要它才会把前端资源打进 exe
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
